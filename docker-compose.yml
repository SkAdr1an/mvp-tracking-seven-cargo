name: seven-cargo

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  volume-init:
    build: .
    user: "0:0"
    command: ["sh", "-c", "install -d -o 10001 -g 10001 -m 0750 /app/data /app/data/backups /app/data/reports/automatic && chown -R 10001:10001 /app/data"]
    volumes: ["./data:/app/data"]
    networks: [internal]
    restart: "no"
    logging: *default-logging

  migrate:
    build: .
    command: ["python", "-m", "app.scripts.migrate_database"]
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      OPERATIONS_DATABASE_PATH: /app/data/operations.db
    volumes: ["./data:/app/data"]
    networks: [internal]
    depends_on:
      volume-init: {condition: service_completed_successfully}
    restart: "no"
    logging: *default-logging

  backend:
    build: .
    env_file: ${APP_ENV_FILE:-.env.production}
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT}
      OPERATIONS_DATABASE_PATH: /app/data/operations.db
      AUTOMATIC_REPORTS_DIRECTORY: /app/data/reports/automatic
      PANEL_COOKIE_SECURE: ${PANEL_COOKIE_SECURE}
      FORCE_HTTPS: ${FORCE_HTTPS}
      EXPOSE_API_DOCS: "false"
      HOME: /tmp
      XDG_CACHE_HOME: /tmp/.cache
      XDG_CONFIG_HOME: /tmp/.config
      TZ: America/Sao_Paulo
    volumes: ["./data:/app/data"]
    networks: [internal]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=256m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_WS_URL: ""
        VITE_PUBLIC_APP_URL: https://${APP_DOMAIN}
    networks: [internal]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/run:size=4m,uid=101,gid=101
    security_opt: ["no-new-privileges:true"]
    logging: *default-logging

  caddy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging

networks:
  internal: {driver: bridge}

volumes:
  caddy-data:
  caddy-config:
