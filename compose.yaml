services:
  migrate:
    build: .
    command: ["python", "-m", "app.scripts.migrate_database"]
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      OPERATIONS_DATABASE_PATH: /app/data/operations.db
    volumes:
      - operations-data:/app/data
    restart: "no"

  backend:
    build: .
    env_file: ${APP_ENV_FILE:-.env}
    environment:
      APP_ENVIRONMENT: production
      OPERATIONS_DATABASE_PATH: /app/data/operations.db
      PANEL_COOKIE_SECURE: "true"
      FORCE_HTTPS: "true"
      EXPOSE_API_DOCS: "false"
      TZ: America/Sao_Paulo
    volumes:
      - operations-data:/app/data
      - reports-data:/app/data/reports
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health',headers={'X-Forwarded-Proto':'https'}),timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /backend
        VITE_WS_URL: wss://${APP_DOMAIN}/backend
        VITE_PUBLIC_APP_URL: https://${APP_DOMAIN}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${TLS_DIRECTORY}:/etc/nginx/tls:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--spider", "https://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  operations-data:
  reports-data:
